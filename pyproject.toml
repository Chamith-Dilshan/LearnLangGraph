[project]
name = "learnlanggraph"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "aiohttp>=3.14.5",
    "colorama>=0.4.6",
    "cryptography==50.0.2",
    "fastmcp>=4.2.0",
    "langchain[mcp]==1.5.2",
    "langchain-community>=0.4.2",
    "langchain-core==1.8.4",
    "langchain-groq==1.2.1",
    "langchain-ollama>=1.1.0",
    "langchain-text-splitters==1.1.3",
    "langgraph==1.2.24",
    "langgraph-checkpoint-postgres==3.2.1",
    "langgraph-checkpoint-sqlite==3.1.3",
    "langgraph-cli[inmem]==0.4.43",
    "langgraph-prebuilt>=1.1.0",
    "langgraph-sdk==0.4.14",
    "langsmith==0.16.0",
    "psycopg[binary,pool]==3.3.9",
    "pydantic==2.14.4",
    "pygments>=2.21.0",
    "pyrefly==1.5.0",
    "python-dotenv==1.2.4",
    "tavily-python>=0.8.5",
    "trustcall>=0.0.39",
    "wikipedia>=1.4.0",
    "httpx2==2.16.2",
    "pytest-asyncio>=1.5.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"